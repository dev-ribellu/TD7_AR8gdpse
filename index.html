<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Suivi d'image NFT v6</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <script>
        // À la détection : on copie la pose du marqueur sur le modèle, une seule fois.
        // Le modèle est ensuite indépendant du marqueur (reste en place même si on perd l'image).
        AFRAME.registerComponent('anchor-on-found', {
            schema: { marker: { type: 'selector' }, target: { type: 'selector' } },
            init: function () {
                this.placed = false;
                const d = this.data;
                d.marker.addEventListener('markerFound', () => {
                    if (this.placed) return;
                    const pos = new THREE.Vector3();
                    const quat = new THREE.Quaternion();
                    const scl = new THREE.Vector3();
                    d.marker.object3D.matrixWorld.decompose(pos, quat, scl);

                    // Décalage vers le centre de l'image (en unités marqueur) puis monde
                    const offset = new THREE.Vector3(50, 50, 0).applyQuaternion(quat);
                    pos.add(offset);

                    d.target.object3D.position.copy(pos);
                    d.target.object3D.quaternion.copy(quat);
                    d.target.object3D.visible = true;
                    this.placed = true;
                    document.getElementById('status').textContent = 'modèle placé';
                });
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
        .arjs-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 1.2em; z-index: 1000; pointer-events: none;
        }
        .message {
            position: absolute; bottom: 12%; width: 100%;
            text-align: center; color: white; z-index: 999;
        }
        #status {
            position: absolute; top: 8px; left: 8px; z-index: 1001;
            background: rgba(0,0,0,0.6); color: #0f0;
            font: 12px monospace; padding: 6px 8px; border-radius: 4px;
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 2%; left: 0; width: 100%;
            z-index: 1002; display: flex; flex-wrap: wrap;
            justify-content: center; gap: 6px;
        }
        #controls button {
            padding: 10px 12px; font-size: 14px; border: 0;
            border-radius: 6px; background: #fff; color: #000;
        }
    </style>
</head>
<body>
    <div class="arjs-loader">Chargement, veuillez patienter...</div>
    <div id="status">init...</div>
    <div class="message">Pointez la caméra vers la flèche jaune</div>

    <div id="controls">
        <button data-r="0 0 0">0 0 0</button>
        <button data-r="90 0 0">90 0 0</button>
        <button data-r="-90 0 0">-90 0 0</button>
        <button data-r="0 90 0">0 90 0</button>
        <button data-r="180 0 0">180 0 0</button>
        <button data-r="90 180 0">90 180 0</button>
        <button data-r="90 90 0">90 90 0</button>
        <button data-r="90 -90 0">90 -90 0</button>
        <button id="reset">Replacer</button>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
        anchor-on-found="marker: #nft; target: #anchor">

        <!-- Marqueur : sert uniquement à détecter l'image, ne contient plus le modèle -->
        <a-nft
            id="nft"
            type="nft"
            url="https://dev-ribellu.github.io/TD7_AR8gdpse/assets/arrow"
            smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        </a-nft>

        <!-- Ancre indépendante du marqueur, cachée jusqu'au premier scan -->
        <a-entity id="anchor" visible="false">
            <a-entity
                id="model"
                gltf-model="url(https://dev-ribellu.github.io/TD7_AR8gdpse/assets/model.glb)"
                scale="2 2 2"
                rotation="90 0 0">
            </a-entity>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const loader = document.querySelector('.arjs-loader');
        const message = document.querySelector('.message');
        const statusEl = document.getElementById('status');
        const scene = document.querySelector('a-scene');
        const nftMarker = document.getElementById('nft');
        const model = document.getElementById('model');
        const anchor = document.getElementById('anchor');

        const log = (t) => { statusEl.textContent = t; console.log('[v6]', t); };

        let loaderHidden = false;
        const hideLoader = () => {
            if (loaderHidden) return;
            loaderHidden = true;
            loader.style.display = 'none';
        };
        setTimeout(hideLoader, 6000);

        scene.addEventListener('arjs-nft-loaded', () => { hideLoader(); log('NFT chargé'); });
        model.addEventListener('model-loaded', () => log('GLB chargé OK'));
        model.addEventListener('model-error', () => log('ERREUR GLB'));
        nftMarker.addEventListener('markerFound', () => { hideLoader(); message.style.display = 'none'; });

        document.querySelectorAll('#controls button[data-r]').forEach(btn => {
            btn.addEventListener('click', () => {
                model.setAttribute('rotation', btn.dataset.r);
                log('rotation = ' + btn.dataset.r);
            });
        });

        // Permet de rescanner et replacer le modèle
        document.getElementById('reset').addEventListener('click', () => {
            const comp = scene.components['anchor-on-found'];
            comp.placed = false;
            anchor.object3D.visible = false;
            message.style.display = 'block';
            log('scanne à nouveau la flèche');
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
