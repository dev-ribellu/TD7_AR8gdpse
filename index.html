<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Suivi d'image NFT v4</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <script>
        // Rotation sur l'axe Z du conteneur (axe vertical du marqueur posé au sol)
        AFRAME.registerComponent('spin', {
            tick: function (time, delta) {
                this.el.object3D.rotation.z += (delta / 1000) * 0.26;
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
        .arjs-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 1.2em; z-index: 1000; pointer-events: none;
        }
        .message {
            position: absolute; bottom: 10%; width: 100%;
            text-align: center; color: white; z-index: 999;
        }
        #status {
            position: absolute; top: 8px; left: 8px; z-index: 1001;
            background: rgba(0,0,0,0.6); color: #0f0;
            font: 12px monospace; padding: 6px 8px; border-radius: 4px;
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 2%; left: 0; width: 100%;
            z-index: 1002; display: flex; flex-wrap: wrap;
            justify-content: center; gap: 6px;
        }
        #controls button {
            padding: 10px 12px; font-size: 14px; border: 0;
            border-radius: 6px; background: #fff; color: #000;
        }
    </style>
</head>
<body>
    <div class="arjs-loader">Chargement, veuillez patienter...</div>
    <div id="status">init...</div>
    <div class="message">Pointez la caméra vers la flèche jaune</div>

    <!-- Boutons de test d'orientation -->
    <div id="controls">
        <button data-r="0 0 0">0 0 0</button>
        <button data-r="90 0 0">90 0 0</button>
        <button data-r="-90 0 0">-90 0 0</button>
        <button data-r="0 90 0">0 90 0</button>
        <button data-r="0 -90 0">0 -90 0</button>
        <button data-r="180 0 0">180 0 0</button>
        <button data-r="90 180 0">90 180 0</button>
        <button data-r="90 90 0">90 90 0</button>
        <button id="toggleSpin">Rotation ON/OFF</button>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">

        <a-nft
            id="nft"
            type="nft"
            url="https://dev-ribellu.github.io/TD7_AR8gdpse/assets/arrow"
            smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

            <!-- Conteneur : position + rotation continue autour de la verticale du marqueur (Z) -->
            <a-entity id="holder" position="50 50 0" spin>
                <!-- Modèle : orientation réglable via les boutons -->
                <a-entity
                    id="model"
                    gltf-model="url(https://dev-ribellu.github.io/TD7_AR8gdpse/assets/model.glb)"
                    scale="2 2 2"
                    rotation="90 0 0">
                </a-entity>
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const loader = document.querySelector('.arjs-loader');
        const message = document.querySelector('.message');
        const statusEl = document.getElementById('status');
        const scene = document.querySelector('a-scene');
        const nftMarker = document.getElementById('nft');
        const model = document.getElementById('model');
        const holder = document.getElementById('holder');

        const log = (t) => { statusEl.textContent = t; console.log('[v4]', t); };

        let loaderHidden = false;
        const hideLoader = () => {
            if (loaderHidden) return;
            loaderHidden = true;
            loader.style.display = 'none';
        };
        setTimeout(hideLoader, 6000);

        scene.addEventListener('arjs-nft-loaded', () => { hideLoader(); log('NFT chargé'); });
        model.addEventListener('model-loaded', () => log('GLB chargé OK'));
        model.addEventListener('model-error', () => log('ERREUR GLB'));
        nftMarker.addEventListener('markerFound', () => { hideLoader(); message.style.display = 'none'; log('marqueur TROUVÉ'); });
        nftMarker.addEventListener('markerLost', () => { message.style.display = 'block'; log('marqueur perdu'); });

        // Boutons d'orientation
        document.querySelectorAll('#controls button[data-r]').forEach(btn => {
            btn.addEventListener('click', () => {
                model.setAttribute('rotation', btn.dataset.r);
                log('rotation modèle = ' + btn.dataset.r);
            });
        });

        // Activer / couper la rotation continue
        let spinning = true;
        document.getElementById('toggleSpin').addEventListener('click', () => {
            if (spinning) { holder.removeAttribute('spin'); }
            else { holder.setAttribute('spin', ''); }
            spinning = !spinning;
            log('rotation continue ' + (spinning ? 'ON' : 'OFF'));
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
