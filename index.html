<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Suivi d'image NFT</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .arjs-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2em;
            z-index: 1000;
        }
        .message {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1em;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="arjs-loader">Chargement, veuillez patienter...</div>
    <div class="message">Pointez la caméra vers la flèche jaune</div>

    <a-scene vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true;" embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        <!-- NFT Marker -->
        <a-nft type="nft" url="assets/arrow" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
            <!-- Modèle 3D -->
            <a-entity gltf-model="assets/model.glb" scale="2 2 2" position="50 0 -50" rotation="-90 0 0" animate-or-rotate></a-entity>
        </a-nft>

        <!-- Caméra -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // --- Masquage de l'écran de chargement ---
        const loader = document.querySelector('.arjs-loader');
        const message = document.querySelector('.message');
        const scene = document.querySelector('a-scene');
        const nftMarker = document.querySelector('a-nft');

        let loaderHidden = false;
        const hideLoader = () => {
            if (loaderHidden) return;
            loaderHidden = true;
            loader.style.display = 'none';
        };

        // Plusieurs déclencheurs, le premier qui part masque le loader
        scene.addEventListener('arjs-nft-loaded', hideLoader);
        scene.addEventListener('loaded', () => setTimeout(hideLoader, 3000));
        nftMarker.addEventListener('markerFound', hideLoader);

        // Sécurité : masquage forcé après 10 secondes
        setTimeout(hideLoader, 10000);

        // --- Messages du marker ---
        nftMarker.addEventListener('markerFound', () => {
            message.style.display = 'none';
        });

        nftMarker.addEventListener('markerLost', () => {
            message.style.display = 'block';
        });

        // --- Rotation continue du modèle ---
        AFRAME.registerComponent('animate-or-rotate', {
            tick: function (time, delta) {
                this.el.object3D.rotation.z += (delta / 1000) * 0.26; // ~15°/s
            }
        });
    </script>

    <!-- Console de debug sur mobile : à SUPPRIMER une fois le problème réglé -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
