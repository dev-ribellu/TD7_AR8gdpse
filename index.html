<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Suivi d'image NFT v9</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <script>
        // Animation (danse) via le mixer THREE
        AFRAME.registerComponent('play-dance', {
            init: function () {
                this.mixer = null;
                this.el.addEventListener('model-loaded', () => {
                    const mesh = this.el.getObject3D('mesh');
                    const clips = (mesh && mesh.animations) || [];
                    document.getElementById('status').textContent =
                        clips.length ? 'GLB OK | clips: ' + clips.map(c => c.name).join(', ') : 'GLB OK | clips: AUCUN';
                    if (!clips.length) return;
                    this.mixer = new THREE.AnimationMixer(mesh);
                    this.mixer.clipAction(clips[0]).setLoop(THREE.LoopRepeat).play();
                });
            },
            tick: function (time, delta) {
                if (this.mixer) this.mixer.update(delta / 1000);
            }
        });

        // Suivi du marqueur + gel de la pose
        //  - tant que le marqueur est visible : le modèle suit la flèche
        //  - marqueur perdu : le modèle reste à sa dernière pose
        //  - "poser" : le modèle est figé dans le monde (ne suit plus)
        AFRAME.registerComponent('follow-marker', {
            schema: { marker: { type: 'selector' } },
            init: function () {
                this.visible = false;
                this.locked = false;
                this.everSeen = false;
                this.tmpPos = new THREE.Vector3();
                this.tmpQuat = new THREE.Quaternion();
                this.tmpScl = new THREE.Vector3();

                // Position par défaut : devant la caméra, au milieu de l'écran
                this.el.object3D.position.set(0, -0.3, -1.5);

                this.data.marker.addEventListener('markerFound', () => {
                    this.visible = true;
                    this.everSeen = true;
                    this.el.object3D.visible = true;
                    document.querySelector('.message').style.display = 'none';
                });
                this.data.marker.addEventListener('markerLost', () => {
                    this.visible = false;
                    if (!this.locked) document.querySelector('.message').style.display = 'block';
                });
            },
            tick: function () {
                if (this.locked || !this.visible) return;
                const m = this.data.marker.object3D;
                m.updateMatrixWorld(true);
                m.matrixWorld.decompose(this.tmpPos, this.tmpQuat, this.tmpScl);

                const o = this.el.object3D;
                // On copie la pose du marqueur dans le repère monde
                o.position.copy(this.tmpPos);
                o.quaternion.copy(this.tmpQuat);
                // Décalage vers le centre de l'image (modifiable via les boutons)
                const off = new THREE.Vector3(window.OFFSET_X, window.OFFSET_Y, 0).applyQuaternion(this.tmpQuat);
                o.position.add(off);
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
        .arjs-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 1.2em; z-index: 1000; pointer-events: none;
        }
        .message {
            position: absolute; bottom: 20%; width: 100%;
            text-align: center; color: white; z-index: 999;
        }
        #status {
            position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1001;
            background: rgba(0,0,0,0.6); color: #0f0;
            font: 12px monospace; padding: 6px 8px; border-radius: 4px;
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 2%; left: 0; width: 100%;
            z-index: 1002; display: flex; flex-wrap: wrap;
            justify-content: center; gap: 6px;
        }
        #controls button {
            padding: 10px 12px; font-size: 14px; border: 0;
            border-radius: 6px; background: #fff; color: #000;
        }
        #controls button.primary { background: #2ecc71; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="arjs-loader">Chargement, veuillez patienter...</div>
    <div id="status">init...</div>
    <div class="message">Pointez la caméra vers la flèche jaune</div>

    <div id="controls">
        <button id="plus">Taille +</button>
        <button id="minus">Taille −</button>
        <button id="ox-minus">← X</button>
        <button id="ox-plus">X →</button>
        <button id="oy-minus">↓ Y</button>
        <button id="oy-plus">Y ↑</button>
        <button id="pose" class="primary">Poser au sol</button>
        <button id="reset">Suivre la flèche</button>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">

        <a-nft
            id="nft"
            type="nft"
            url="https://dev-ribellu.github.io/TD7_AR8gdpse/assets/arrow"
            smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        </a-nft>

        <!-- Ancre : suit le marqueur (follow-marker), indépendante de la hiérarchie du NFT -->
        <a-entity id="anchor" follow-marker="marker: #nft">
            <a-entity
                id="model"
                gltf-model="url(https://dev-ribellu.github.io/TD7_AR8gdpse/assets/dance.glb)"
                play-dance
                scale="64 64 64"
                rotation="-90 0 0">
            </a-entity>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Décalage vers le centre de l'image (en unités du marqueur NFT)
        window.OFFSET_X = 0;
        window.OFFSET_Y = 0;

        const loader = document.querySelector('.arjs-loader');
        const statusEl = document.getElementById('status');
        const scene = document.querySelector('a-scene');
        const nftMarker = document.getElementById('nft');
        const model = document.getElementById('model');
        const anchor = document.getElementById('anchor');

        const log = (t) => { statusEl.textContent = t; console.log('[v9]', t); };

        let loaderHidden = false;
        const hideLoader = () => {
            if (loaderHidden) return;
            loaderHidden = true;
            loader.style.display = 'none';
        };
        setTimeout(hideLoader, 6000);
        scene.addEventListener('arjs-nft-loaded', hideLoader);
        nftMarker.addEventListener('markerFound', hideLoader);
        model.addEventListener('model-error', () => log('ERREUR GLB (vérifie assets/dance.glb)'));

        // --- Taille ---
        let currentScale = 1;
        const applyScale = () => {
            model.setAttribute('scale', currentScale + ' ' + currentScale + ' ' + currentScale);
            log('scale = ' + currentScale.toFixed(3));
        };
        document.getElementById('plus').addEventListener('click', () => { currentScale *= 1.5; applyScale(); });
        document.getElementById('minus').addEventListener('click', () => { currentScale /= 1.5; applyScale(); });

        // --- Décalage pour centrer sur l'image ---
        const STEP = 20;
        const shift = (dx, dy) => {
            window.OFFSET_X += dx; window.OFFSET_Y += dy;
            log('offset = ' + window.OFFSET_X + ', ' + window.OFFSET_Y);
        };
        document.getElementById('ox-minus').addEventListener('click', () => shift(-STEP, 0));
        document.getElementById('ox-plus').addEventListener('click', () => shift(STEP, 0));
        document.getElementById('oy-minus').addEventListener('click', () => shift(0, -STEP));
        document.getElementById('oy-plus').addEventListener('click', () => shift(0, STEP));

        // --- Poser au sol ---
        // Fige le modèle à sa position actuelle dans le monde.
        // (Détection du sol WebXR non combinable avec AR.js NFT : on fige donc la pose courante.)
        document.getElementById('pose').addEventListener('click', () => {
            const comp = anchor.components['follow-marker'];
            comp.locked = true;
            document.querySelector('.message').style.display = 'none';
            log('modèle posé (figé)');
        });

        // --- Reprendre le suivi de la flèche ---
        document.getElementById('reset').addEventListener('click', () => {
            const comp = anchor.components['follow-marker'];
            comp.locked = false;
            log('suit la flèche');
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
