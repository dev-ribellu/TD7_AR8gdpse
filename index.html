<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Suivi d'image NFT v3</title>

    <!-- A-Frame 1.3.0 (compatible AR.js 3.4.5) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <!-- Composant déclaré AVANT la scène -->
    <script>
        AFRAME.registerComponent('animate-or-rotate', {
            tick: function (time, delta) {
                // Rotation autour de l'axe vertical (~15°/s)
                this.el.object3D.rotation.y += (delta / 1000) * 0.26;
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
        .arjs-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 1.2em; z-index: 1000;
            pointer-events: none;
        }
        .message {
            position: absolute; bottom: 10%; width: 100%;
            text-align: center; color: white; font-size: 1em; z-index: 999;
        }
        #status {
            position: absolute; top: 8px; left: 8px; z-index: 1001;
            background: rgba(0,0,0,0.6); color: #0f0;
            font: 12px monospace; padding: 6px 8px; border-radius: 4px;
            max-width: 90%; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="arjs-loader">Chargement, veuillez patienter...</div>
    <div id="status">init...</div>
    <div class="message">Pointez la caméra vers la flèche jaune</div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">

        <!-- NFT Marker : URL absolue, SANS extension -->
        <a-nft
            id="nft"
            type="nft"
            url="https://dev-ribellu.github.io/TD7_AR8gdpse/assets/arrow"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">

            <!-- Modèle 3D debout sur le sol -->
            <a-entity
                id="model"
                gltf-model="url(https://dev-ribellu.github.io/TD7_AR8gdpse/assets/model.glb)"
                scale="2 2 2"
                position="50 0 0"
                rotation="90 0 0"
                animate-or-rotate>
            </a-entity>
        </a-nft>

        <!-- Caméra -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const loader = document.querySelector('.arjs-loader');
        const message = document.querySelector('.message');
        const statusEl = document.getElementById('status');
        const scene = document.querySelector('a-scene');
        const nftMarker = document.getElementById('nft');
        const model = document.getElementById('model');

        const log = (t) => { statusEl.textContent = t; console.log('[v3]', t); };

        let loaderHidden = false;
        const hideLoader = () => {
            if (loaderHidden) return;
            loaderHidden = true;
            loader.style.display = 'none';
        };

        // Sécurité : on masque le loader dans tous les cas après 6 s
        setTimeout(hideLoader, 6000);

        scene.addEventListener('loaded', () => log('scène chargée'));
        scene.addEventListener('arjs-nft-loaded', () => { hideLoader(); log('NFT chargé, cherche la flèche...'); });
        scene.addEventListener('camera-init', () => log('caméra OK'));
        scene.addEventListener('camera-error', () => { hideLoader(); log('ERREUR caméra (autorise l\'accès)'); });

        model.addEventListener('model-loaded', () => log('GLB chargé OK'));
        model.addEventListener('model-error', (e) => { hideLoader(); log('ERREUR GLB (voir console)'); console.error(e); });

        nftMarker.addEventListener('markerFound', () => {
            hideLoader();
            message.style.display = 'none';
            log('marqueur TROUVÉ');
        });
        nftMarker.addEventListener('markerLost', () => {
            message.style.display = 'block';
            log('marqueur perdu');
        });
    </script>

    <!-- Console de debug mobile : à SUPPRIMER une fois que tout marche -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
